tooling:
  to_editable: python synapse_roundtrip.py --workdir .synapse_work/finance to-editable --file <artifact.json>
  to_artifact: python synapse_roundtrip.py --workdir .synapse_work/finance to-json --file <editable-file>
  new_sql_artifact: python synapse_roundtrip.py --workdir .synapse_work/finance new-sqlscript --root Synapse-itf-Dev --database itf_frog --pool itf_frog --name <artifact-name> --folder <folder-name>
  build_index: python tools/build_synapse_index.py --root Synapse-itf-Dev --out .synapse_index/finance
  build_lineage: python tools/build_lineage.py --root Synapse-itf-Dev --out .lineage/finance --title "Finance (ITF FROG)" --layers "raw;landing;curated;staging=dwh_stg,dwh;core=dbo;reporting=rpt;bronze;silver;gold;out_gold=out_gold"
  validate: null

architecture:
  pattern: custom-layered                        # classic SQL-pool flow plus a medallion (bronze/silver/gold) track
  layers:
    # Classic Adastra/PLBM flow (README: Raw -> Landing -> Curated -> Staging -> Core -> Reporting)
    - name: raw
      stage: ingest
      description: Adastra file share copied to ADLS by PL_Copydata_AD_ITS.   # evidence: README.md
    - name: landing
      stage: ingest
      description: PL_DL_ITF_raw_to_landing -> NB_itf_planenbm-itf_raw_landing.   # evidence: README.md
    - name: curated
      stage: refine
      description: PL_load_itf_landing_curated (ForEach feed_list) -> NB_itf_dl_landing_to_curated.   # evidence: README.md
    - name: staging
      stage: refine
      description: nb_itf_dl_Curated_to_Processing; SQL pool schemas dwh_stg / dwh, SCD2 loads dwh.sp_Load_*.   # evidence: sp_Load_T_IMPORT_PAF_WA_Stammdaten_R4
    - name: core
      stage: model
      description: dbo T_DIM_* / T_IMPORT_*_neuesteDaten loaded by dbo.sp_Run_ETL_Driver -> P_DIM_* / P_IMPORT_*.   # evidence: sp_Run_ETL_Driver
      scd_default: type1                         # evidence: user
    - name: reporting
      stage: serve
      description: rpt P_R_* procedures fill reporting tables via rpt.SP_Master_Core_to_Reporting; Power BI.   # evidence: README.md, P_R_WA_Dashboard
      target_schema: rpt
    # Medallion track (Delta_master_Trigger -> PL_Master_Injection)
    - name: bronze
      stage: ingest
      description: NB_landing_to_bronze*, NB_bronze_metadata_table.   # evidence: notebooks.names
    - name: silver
      stage: refine
      description: NB_bronze_to_silver, NB_silver_table_schema, NB_silver_validation; SCD Type 2.   # evidence: notebooks.names; user
      scd_default: type2                         # evidence: user
    - name: gold
      stage: model
      description: Per-object notebooks t_dim_* / t_fact_*, create_gold_table_statement, Gold_Layer_Execution.   # evidence: notebooks.names
      scd_default: type1                         # evidence: user
    - name: out_gold
      stage: serve
      description: Serverless it_finance.out_gold external tables and views over gold.   # evidence: sql.schemas.out_gold
      target_schema: out_gold

orchestration:
  style: metadata-driven                         # evidence: ForEach over feed_list, dwh.FinanceFeedMetadata, sp_Dynamic* procs
  engine: synapse_pipelines
  control_metadata_schema: dwh                   # evidence: dwh.FinanceFeedMetadata, dwh.SCD2_Load_Audit
  reuse_before_create: true

lineage:
  sources:
    - type: generated                            # table-level, from script dependencies; rebuild with tooling.build_lineage
      path: .lineage/finance/lineage.json
      pdf: .lineage/finance/lineage.pdf
    - type: code_search
    - type: <lineage document path>              # user will add later

schema_evidence:
  - curated / silver Spark schema
  - Synapse-itf-Dev/sqlscript staging DDL (DWH_Scrpit/create_staging table)

approvals:
  convert_or_publish: required
  deploy: required
